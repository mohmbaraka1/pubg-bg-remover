server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # يمرّر أي طلب /api لخدمة الباك إند بنفس الشبكة (اسم الخدمة "backend"
    # بـ docker-compose.yml) - نفس فكرة بروكسي Vite بالتطوير المحلي، بس
    # بالإنتاج. لو الباك إند مستضاف بدومين منفصل تماماً، احذف هذا الـ location
    # واضبط VITE_API_URL وقت البناء بدلاً منه.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }

    # SPA: أي مسار غير موجود كملف يرجع لـ index.html (React Router يتولى التوجيه)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
