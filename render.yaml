services:
  - type: web
    name: gs-studio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: BG_REMOVER_DEVICE
        value: cpu
      - key: CORS_ALLOWED_ORIGINS
        value: https://pubg-bg-remover.vercel.app
